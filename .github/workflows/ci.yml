name: Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [smoke, full-regression]
        default: smoke
      email_report:
        description: Send a test email after this manual run
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * 1'
      timezone: Asia/Dubai

permissions:
  contents: read

concurrency:
  group: test-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
      suite_name: ${{ steps.select_suite.outputs.name }}

    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Select test suite
        id: select_suite
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'smoke' }}
        run: |
          case "$REQUESTED_SUITE" in
            smoke|full-regression) echo "name=$REQUESTED_SUITE" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown test suite: $REQUESTED_SUITE" >&2; exit 1 ;;
          esac

      - name: Run selected suite
        env:
          TEST_STANDARD_USER_EMAIL: ${{ secrets.TEST_STANDARD_USER_EMAIL }}
          TEST_STANDARD_USER_PASSWORD: ${{ secrets.TEST_STANDARD_USER_PASSWORD }}
          SELECTED_SUITE: ${{ steps.select_suite.outputs.name }}
        run: mvn --batch-mode test -DsuiteXmlFile="suites/${SELECTED_SUITE}.xml" -Dbrowser=chrome -Dheadless=true

      - name: Restore previous Allure history
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          SELECTED_SUITE: ${{ steps.select_suite.outputs.name }}
        run: |
          if [ "$SELECTED_SUITE" = "full-regression" ]; then
            history_branch=allure-history-full-regression
          else
            history_branch=allure-history
          fi
          set +e
          git ls-remote --exit-code --heads origin "$history_branch" >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin "$history_branch"
            mkdir -p .allure-history
            git archive FETCH_HEAD | tar -x -C .allure-history
          elif [ "$status" -ne 2 ]; then
            echo "Could not check the Allure history branch."
            exit "$status"
          fi

      - name: Generate Allure report
        id: report
        if: always()
        shell: bash
        run: |
          if [ ! -d target/allure-results ] || [ -z "$(find target/allure-results -maxdepth 1 -name '*-result.json' -print -quit)" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Allure test results were produced."
            exit 0
          fi

          if [ -d .allure-history ]; then
            mkdir -p target/allure-results/history
            cp -a .allure-history/. target/allure-results/history/
          fi

          mvn --batch-mode allure:report
          test -f target/site/allure-maven-plugin/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Transfer Allure history to the save job
        if: ${{ always() && steps.report.outputs.ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-history
          path: target/site/allure-maven-plugin/history/
          retention-days: 1

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-evidence
          path: |
            target/allure-results/
            target/surefire-reports/
            target/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Save readable Allure report
        if: ${{ always() && steps.report.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 7

  save_history:
    needs: tests
    if: ${{ always() && needs.tests.outputs.report_ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Get repository for history branch
        uses: actions/checkout@v6

      - name: Download Allure history
        uses: actions/download-artifact@v6
        with:
          name: allure-history
          path: ${{ runner.temp }}/allure-history

      - name: Save latest history on its own branch
        shell: bash
        env:
          SELECTED_SUITE: ${{ needs.tests.outputs.suite_name }}
        run: |
          if [ "$SELECTED_SUITE" = "full-regression" ]; then
            history_branch=allure-history-full-regression
          else
            history_branch=allure-history
          fi
          set +e
          git ls-remote --exit-code --heads origin "$history_branch" >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin "$history_branch"
            git switch -C "$history_branch" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git switch --orphan "$history_branch"
          else
            echo "Could not check the Allure history branch."
            exit "$status"
          fi
          cp "$RUNNER_TEMP"/allure-history/*.json .
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Update Allure history'
            git push origin "HEAD:$history_branch"
          fi

  publish:
    needs: tests
    if: ${{ always() && needs.tests.outputs.report_ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v6
        with:
          name: allure-report
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish Allure report
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: [tests, save_history, publish]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.email_report)) }}
    runs-on: ubuntu-24.04

    steps:
      - name: Get notification script
        uses: actions/checkout@v6

      - name: Check whether the two-week email is due
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import date, datetime, timezone
          from os import environ

          first_report = date(2026, 11, 23)
          today = datetime.now(timezone.utc).date()
          send = environ['EVENT_NAME'] == 'workflow_dispatch' or ((today - first_report).days // 7) % 2 == 0
          with open(environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"send={str(send).lower()}\n")
          PY

      - name: Download report summary
        if: ${{ steps.due.outputs.send == 'true' && needs.tests.outputs.report_ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: allure-report
          path: site

      - name: Email result when configured
        if: ${{ steps.due.outputs.send == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_URL: ${{ needs.publish.outputs.page_url }}
          RUN_RESULT: ${{ needs.tests.result }}
          SUITE_NAME: ${{ needs.tests.outputs.suite_name }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          HISTORY_RESULT: ${{ needs.save_history.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/send_report.py
