name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run smoke suite
        run: mvn --batch-mode test -DsuiteXmlFile=suites/smoke.xml -Dbrowser=chrome -Dheadless=true

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            target/allure-results/
            target/surefire-reports/
            target/logs/
          if-no-files-found: warn
          retention-days: 7
